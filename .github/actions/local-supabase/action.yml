name: Local Supabase
description: >
  A throwaway Supabase on the runner, the one every test runs against: the repo's migrations
  and seed (`supabase/seed.sql`, the shipped content plus the stress cases), its keys in the
  job's environment, and the test admin. Dev and prod are never touched. Run after `npm ci`.

runs:
  using: composite
  steps:
    # Only what the app uses: Postgres, Auth, Storage, the REST API and its gateway.
    - name: Start Supabase (migrations + seed)
      shell: bash
      run: npx supabase start -x realtime,studio,imgproxy,mailpit,edge-runtime,logflare,vector,postgres-meta,supavisor
    - name: Its keys, for the build, the server and the tests
      shell: bash
      run: |
        eval "$(npx supabase status -o env)"
        {
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
        } >> "$GITHUB_ENV"
    - name: The test admin
      shell: bash
      run: |
        eval "$(npx supabase status -o env)"
        NEXT_PUBLIC_SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" \
          node scripts/test-admin.mjs

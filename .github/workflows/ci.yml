name: CI

# Every check, on every PR and push to `main`, and on demand: Actions → CI → Run workflow
# runs the same checks on any branch, outside a PR. Everything runs against a throwaway local
# Supabase on the runner, loaded with the seed (the shipped content plus the stress cases), so
# the tests go through the paths production runs (queries, RLS, sign-in, uploads) and never
# touch dev or prod. No repository secrets are needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The test admin exists only in the local Supabase (scripts/test-admin.mjs), gone with it.
  E2E_ADMIN_EMAIL: e2e-admin@example.com
  E2E_ADMIN_PASSWORD: local-only-test-admin-password
  # The heat map's real path: GitHub's API with this run's token (read-only). If GitHub
  # fails, the map is simply not rendered, as in production.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the pinned test-results comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test # unit: offline (PGlite for the migrations and RLS)
      - uses: ./.github/actions/local-supabase
      # The repository contract, RLS, auth and storage against the real Supabase.
      - run: npm run test:db -- --outputFile.junit=reports/db.xml
      - run: npm run build
      # Safari's engine for the iPhone project (Chrome is already on the runner).
      - run: npx playwright install --with-deps webkit
      # Critical-path journeys against the production build, the signed-in admin's saves
      # included (they write to the local Supabase), in Chrome (desktop, phone) and Safari's
      # engine (iPhone). Functionality gates the PR.
      - run: npx playwright test e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/smoke.xml
      # Accessibility is a reading, not a gate (owner, brief §3): a failure is flagged as a
      # warning on the PR (amber), never a red check. The site and every admin screen.
      - name: Accessibility (axe) — flagged, non-blocking
        id: a11y
        continue-on-error: true
        run: npx playwright test e2e/a11y.spec.ts e2e/admin-a11y.spec.ts
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/a11y.xml
      - if: steps.a11y.outcome == 'failure'
        run: echo "::warning title=Accessibility::axe found violations; see the a11y step and the playwright-traces artifact."
      # Names each e2e suite after its viewport and writes the PR comment's table.
      - name: Prepare test report
        if: ${{ !cancelled() }}
        run: mkdir -p reports && node scripts/test-summary.mjs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > reports/comment.md
      # One readable report (every test, pass or fail) on the run's Summary page, linked from
      # the PR's check. It never decides the outcome: the test steps above do.
      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests
          path: reports/*.xml
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-error: 'false'
          fail-on-empty: 'false'
      # The same results as a short table pinned to the PR, edited on every push.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: test-results
          path: reports/comment.md
      - uses: actions/upload-artifact@v7
        if: failure() || steps.a11y.outcome == 'failure'
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Lighthouse is a reading, not a gate (brief §3, §6 Phase 9.1): its own job beside `check`,
  # so it neither slows nor fails the required check. Scores below budget show as warnings
  # (amber) and in a pinned PR comment; the job itself always passes.
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the pinned scores comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/local-supabase
      - run: npm run build
      - name: Lighthouse (site + signed-in admin; mobile + desktop) — flagged, non-blocking
        id: lighthouse
        continue-on-error: true
        run: npm run lighthouse
      - if: steps.lighthouse.outcome == 'failure'
        run: echo "::warning title=Lighthouse::The Lighthouse run itself failed; see the step log."
      - name: Scores on the run's Summary page
        if: ${{ !cancelled() && hashFiles('reports/lighthouse.md') != '' }}
        run: cat reports/lighthouse.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('reports/lighthouse.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: lighthouse
          path: reports/lighthouse.md
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
